name: ejson
description: Offline desktop JSON workspace.
publish_to: none
version: 0.0.4+1
environment:
  sdk: ^3.12.2
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  package_info_plus: ^10.2.2
  pub_semver: ^2.2.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.0
  cupertino_icons: ^1.0.8
  ejson_core: ^0.1.0
  flutter_riverpod: ^3.0.0
  file_selector: ^1.1.0
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  window_manager: ^0.5.1
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/logo_light.png
    - assets/branding/logo_dark.png
