name: Desktop checks

on: [push, pull_request]

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/ejson
      - run: dart format --output=none --set-exit-if-changed apps/ejson/lib apps/ejson/test packages/ejson_core
      - run: flutter analyze --no-pub
      - run: dart test
        working-directory: packages/ejson_core
      - run: flutter test --no-pub
        working-directory: apps/ejson
      - run: flutter build ${{ matrix.target }} --debug --no-pub
        working-directory: apps/ejson
